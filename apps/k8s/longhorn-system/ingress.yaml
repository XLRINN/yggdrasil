apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-ingress
  namespace: longhorn-system
  annotations:
    # We REMOVED the middleware/auth lines here
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
  - host: "longhorn.drip.heimdal.rip"  # Ensure this matches your DNS
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: longhorn-frontend
            port:
              number: 80
