---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: seer
  namespace: knarr
automountServiceAccountToken: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seer-config
  namespace: knarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seer
  namespace: knarr
  labels:
    app: seer
spec:
  serviceName: seer
  selector:
    matchLabels:
      app: seer
  template:
    metadata:
      labels:
        app: seer
    spec:
      serviceAccountName: seer
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: seer
          image: ghcr.io/seerr-team/seerr:latest
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: http
              containerPort: 5055
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: seer-config
---
apiVersion: v1
kind: Service
metadata:
  name: seer
  namespace: knarr
spec:
  type: ClusterIP
  selector:
    app: seer
  ports:
    - port: 80
      targetPort: http
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seer
  namespace: knarr
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - seer.drip.yggdrasil.rip
    secretName: seer-tls
  rules:
    - host: seer.drip.yggdrasil.rip
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: seer
                port:
                  number: 80
