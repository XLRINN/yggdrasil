# ---------------------------------------------------
# 1. THE ARCHIVE (The Cloud Bridge)
# Apps see this as /data. Files here live on the host at /njord
# ---------------------------------------------------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: njord-pv
spec:
  storageClassName: manual
  capacity:
    storage: 100Ti # Arbitrary "unlimited" size
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: 192.168.69.5
    path: /mnt/mimmis/poeticEdda
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-pvc
  namespace: knarr
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Ti
  volumeName: njord-pv

---
