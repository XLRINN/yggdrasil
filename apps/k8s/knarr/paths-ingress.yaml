apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-knarr-prefix
  namespace: knarr
spec:
  stripPrefix:
    prefixes:
      - /sonarr
      - /radarr
      - /prowlarr
      - /jelly
      - /crunchy
      - /seer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: knarr-paths-ingress
  namespace: knarr
  annotations:
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.middlewares: knarr-strip-knarr-prefix@kubernetescrd
spec:
  rules:
  - host: yggdrasil.rip
    http:
      paths:
      - path: /sonarr
        pathType: Prefix
        backend:
          service:
            name: sonarr
            port:
              number: 80
      - path: /radarr
        pathType: Prefix
        backend:
          service:
            name: radarr
            port:
              number: 80
      - path: /sabnzbd
        pathType: Prefix
        backend:
          service:
            name: sabnzbd
            port:
              number: 80
      - path: /prowlarr
        pathType: Prefix
        backend:
          service:
            name: prowlarr
            port:
              number: 80
      - path: /jelly
        pathType: Prefix
        backend:
          service:
            name: jellyfin
            port:
              number: 80
      - path: /crunchy
        pathType: Prefix
        backend:
          service:
            name: sonarr-anime
            port:
              number: 80
      - path: /seer
        pathType: Prefix
        backend:
          service:
            name: seer
            port:
              number: 80
