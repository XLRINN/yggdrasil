---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flok-config-pvc
  namespace: knarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flok
  namespace: knarr
  labels:
    app: flok
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flok
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: flok
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      initContainers:
      - name: inotify-sysctl
        image: busybox
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        command:
        - sh
        - -c
        - |
          sysctl -w fs.inotify.max_user_watches=524288
          sysctl -w fs.inotify.max_user_instances=512
      containers:
      - name: jellyfin
        image: lscr.io/linuxserver/jellyfin:latest
        imagePullPolicy: Always
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/New_York"
        ports:
        - containerPort: 8096
          name: http
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: flok-config-pvc
      - name: media
        persistentVolumeClaim:
          claimName: media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: flok
  namespace: knarr
spec:
  selector:
    app: flok
  ports:
  - port: 80
    targetPort: 8096
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flok-ingress
  namespace: knarr
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/target: "14dba35c-b082-4cf5-8319-05b87f07357c.cfargotunnel.com"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Flok"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "jellyfin.png"
    gethomepage.dev/description: "Block programming & commercials"
spec:
  rules:
  - host: flok.yggdrasil.rip
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: flok
            port:
              number: 80
