---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-anime-config-pvc
  namespace: knarr
  labels:
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr-anime
  namespace: knarr
  labels:
    app: sonarr-anime
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr-anime
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: sonarr-anime
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      initContainers:
      - name: inotify-sysctl
        image: busybox
        securityContext:
          privileged: true
        command:
        - sh
        - -c
        - |
          sysctl -w fs.inotify.max_user_watches=524288
          sysctl -w fs.inotify.max_user_instances=512
          sysctl -w net.ipv6.conf.all.disable_ipv6=1
          sysctl -w net.ipv6.conf.default.disable_ipv6=1
      - name: set-urlbase
        image: busybox
        command:
        - sh
        - -c
        - |
          CONFIG=/config/config.xml
          if [ -f "$CONFIG" ]; then
            if grep -q '<UrlBase' "$CONFIG"; then
              sed -i 's|<UrlBase/>|<UrlBase>/crunchy</UrlBase>|g' "$CONFIG"
              sed -i 's|<UrlBase>[^<]*</UrlBase>|<UrlBase>/crunchy</UrlBase>|g' "$CONFIG"
            else
              sed -i 's|</Config>|  <UrlBase>/crunchy</UrlBase>\n</Config>|' "$CONFIG"
            fi
          fi
        volumeMounts:
        - name: config
          mountPath: /config
      containers:
      - name: sonarr-anime
        image: lscr.io/linuxserver/sonarr:latest
        env:
        - name: PUID
          value: "1000"
        - name: SONARR__SERVER__URLBASE
          value: "/crunchy"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/New_York"
        - name: DOTNET_SYSTEM_NET_DISABLEIPV6
          value: "true"
        - name: HTTPS_PROXY
          value: "http://10.42.0.1:3128"
        - name: NO_PROXY
          value: "localhost,127.0.0.1,10.42.0.0/16,10.43.0.0/16,.cluster.local"
        lifecycle:
          postStart:
            exec:
              command:
                - /bin/sh
                - -c
                - ln -sf /app/sonarr/bin/UI/sonarr /app/sonarr/bin/UI/crunchy
        ports:
        - containerPort: 8989
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /media
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: sonarr-anime-config-pvc
      - name: media
        persistentVolumeClaim:
          claimName: media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr-anime
  namespace: knarr
spec:
  selector:
    app: sonarr-anime
  ports:
  - port: 80
    targetPort: 8989
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr-anime-ingress
  namespace: knarr
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/target: "14dba35c-b082-4cf5-8319-05b87f07357c.cfargotunnel.com"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Sonarr Anime"
    gethomepage.dev/group: "Downloads"
    gethomepage.dev/icon: "sonarr.png"
    gethomepage.dev/description: "Anime series manager"
spec:
  rules:
  - host: anime.yggdrasil.rip
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sonarr-anime
            port:
              number: 80
