apiVersion: v1
kind: List
items:
  # --- PVC for Tunarr Configuration ---
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: tunarr-config-pvc
      namespace: knarr
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      # storageClassName: local-path # Uncomment if you use a specific class

  # --- Deployment ---
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: tunarr
      namespace: knarr
      labels:
        app: tunarr
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: tunarr
      template:
        metadata:
          labels:
            app: tunarr
        spec:
          # --- Disable IPv6 (Just like Prowlarr, to prevent timeouts) ---
          hostNetwork: true
          dnsConfig:
            options:
              - name: ndots
                value: "1"
          containers:
            - name: tunarr
              image: ghcr.io/chrisbenincasa/tunarr:latest
              imagePullPolicy: Always
              env:
                - name: TZ
                  value: "America/New_York"
                - name: PUID
                  value: "1000"
                - name: PGID
                  value: "1000"
                - name: LOG_LEVEL
                  value: "info"
              ports:
                - containerPort: 8000
                  name: http
              volumeMounts:
                # Mount for Tunarr's internal database/settings
                - name: config
                  mountPath: /root/.local/share/tunarr
                # Mount for your Media (Movies/TV) so Tunarr can stream files directly
                - name: media
                  mountPath: /media
              # --- Hardware Acceleration (Optional) ---
              # Uncomment below if you want to use VAAPI/QuickSync for transcoding
              # securityContext:
              #   privileged: true
          volumes:
            - name: config
              persistentVolumeClaim:
                claimName: tunarr-config-pvc
            - name: media
              persistentVolumeClaim:
                # Using the PVC you referenced in your first prompt
                claimName: media-pvc

  # --- Service ---
  - apiVersion: v1
    kind: Service
    metadata:
      name: tunarr
      namespace: knarr
    spec:
      type: NodePort
      selector:
        app: tunarr
      ports:
        - port: 8000
          targetPort: 8000
          nodePort: 30800
          name: http

  # --- Ingress ---
  - apiVersion: networking.k8s.io/v1
    kind: Ingress
    metadata:
      name: tunarr-ingress
      namespace: knarr
      annotations:
        kubernetes.io/ingress.class: traefik
        external-dns.alpha.kubernetes.io/target: "14dba35c-b082-4cf5-8319-05b87f07357c.cfargotunnel.com"
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Tunarr"
        gethomepage.dev/group: "Media"
        gethomepage.dev/icon: "tunarr.png"
        gethomepage.dev/description: "Virtual channel DVR"
    spec:
      rules:
        - host: tunarr.yggdrasil.rip
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: tunarr
                    port:
                      number: 8000
