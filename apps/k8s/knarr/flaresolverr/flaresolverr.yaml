---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flaresolverr
  namespace: knarr
  labels:
    app: flaresolverr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: flaresolverr
  template:
    metadata:
      labels:
        app: flaresolverr
    spec:
      containers:
      - name: flaresolverr
        image: ghcr.io/flaresolverr/flaresolverr:latest
        env:
        - name: LOG_LEVEL
          value: "info"
        - name: TZ
          value: "America/New_York"
        ports:
        - containerPort: 8191
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: knarr
spec:
  selector:
    app: flaresolverr
  ports:
  - port: 8191
    targetPort: 8191
