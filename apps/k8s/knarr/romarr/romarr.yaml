---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: romarr-config-pvc
  namespace: knarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: romarr
  namespace: knarr
  labels:
    app: romarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: romarr
  template:
    metadata:
      labels:
        app: romarr
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: romarr
        image: ghcr.io/blizzhacker/romarr:latest
        imagePullPolicy: Always
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/New_York"
        - name: PROWLARR_URL
          value: "http://prowlarr.knarr.svc.cluster.local/prowlarr"
        - name: PROWLARR_API_KEY
          value: "fdfebb1f940c4bc3b8c6c487c601928a"
        - name: LIBRARY_KIND
          value: "romm"
        - name: LIBRARY_URL
          value: "http://romm.knarr.svc.cluster.local"
        - name: LIBRARY_PATH
          value: "/roms"
        - name: QBITTORRENT_URL
          value: "http://qbittorrent.knarr.svc.cluster.local:80"
        - name: SABNZBD_URL
          value: "http://sabnzbd.knarr.svc.cluster.local/sab"
        - name: SABNZBD_API_KEY
          value: "9f1564baf2ec45f6b0937b2b00e61695"
        - name: ROMARR_PORT
          value: "6868"
        ports:
        - containerPort: 6868
          name: http
        volumeMounts:
        - name: config
          mountPath: /config
        - name: media
          mountPath: /roms
        - name: downloads
          mountPath: /media
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: romarr-config-pvc
      - name: media
        persistentVolumeClaim:
          claimName: romm-library-pvc
      - name: downloads
        persistentVolumeClaim:
          claimName: media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: romarr
  namespace: knarr
spec:
  type: NodePort
  selector:
    app: romarr
  ports:
  - port: 6868
    targetPort: 6868
    nodePort: 30686
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: romarr-ingress
  namespace: knarr
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/target: "14dba35c-b082-4cf5-8319-05b87f07357c.cfargotunnel.com"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "ROMarr"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "radarr.png"
    gethomepage.dev/description: "ROM acquisition manager"
spec:
  rules:
  - host: romarr.yggdrasil.rip
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: romarr
            port:
              number: 6868
