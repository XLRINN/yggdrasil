---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config-pvc
  namespace: knarr
  labels:
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: knarr
  labels:
    app: prowlarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prowlarr
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: prowlarr
    spec:

      dnsConfig:
        options:
          - name: ndots
            value: "1"
          - name: single-request-reopen

      initContainers:
      - name: set-urlbase
        image: busybox
        command:
        - sh
        - -c
        - |
          CONFIG=/config/config.xml
          if [ -f "$CONFIG" ]; then
            if grep -q '<UrlBase' "$CONFIG"; then
              sed -i 's|<UrlBase/>|<UrlBase>/prowlarr</UrlBase>|g' "$CONFIG"
              sed -i 's|<UrlBase>[^<]*</UrlBase>|<UrlBase>/prowlarr</UrlBase>|g' "$CONFIG"
            else
              sed -i 's|</Config>|  <UrlBase>/prowlarr</UrlBase>\n</Config>|' "$CONFIG"
            fi
          fi
        volumeMounts:
        - name: config
          mountPath: /config
      containers:
      - name: prowlarr
        image: lscr.io/linuxserver/prowlarr:latest
        env:
        - name: DOTNET_SYSTEM_NET_DISABLEIPV6
          value: "1"
        - name: HTTPS_PROXY
          value: "http://10.42.0.1:3128"
        - name: NO_PROXY
          value: "localhost,127.0.0.1,10.42.0.0/16,10.43.0.0/16,.cluster.local"
        - name: DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP3SUPPORT
          value: "0"
        - name: PUID
          value: "1000"
        - name: PROWLARR__SERVER__URLBASE
          value: "/prowlarr"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/New_York"
        ports:
        - containerPort: 9696
        volumeMounts:
        - name: config
          mountPath: /config
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: prowlarr-config-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: knarr
spec:
  selector:
    app: prowlarr
  ports:
  - port: 80
    targetPort: 9696
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr-ingress
  namespace: knarr
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/target: "14dba35c-b082-4cf5-8319-05b87f07357c.cfargotunnel.com"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Prowlarr"
    gethomepage.dev/group: "Downloads"
    gethomepage.dev/icon: "prowlarr.png"
    gethomepage.dev/description: "Indexer manager"
spec:
  rules:
  - host: prowlarr.yggdrasil.rip
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prowlarr
            port:
              number: 80
