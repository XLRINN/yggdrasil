---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nostalgiatv-data-pvc
  namespace: knarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nostalgiatv
  namespace: knarr
  labels:
    app: nostalgiatv
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: nostalgiatv
  template:
    metadata:
      labels:
        app: nostalgiatv
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: nostalgiatv
        image: purestream711/nostalgiatv-server:latest
        imagePullPolicy: Always
        env:
        - name: TZ
          value: "America/New_York"
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        ports:
        - containerPort: 19850
          name: http
        volumeMounts:
        - name: data
          mountPath: /app/data
        - name: config
          mountPath: /app/config
        - name: logos
          mountPath: /app/logos
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: nostalgiatv-data-pvc
      - name: config
        emptyDir: {}
      - name: logos
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nostalgiatv
  namespace: knarr
spec:
  type: NodePort
  selector:
    app: nostalgiatv
  ports:
  - port: 19850
    targetPort: 19850
    nodePort: 30985
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nostalgiatv-ingress
  namespace: knarr
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/target: "14dba35c-b082-4cf5-8319-05b87f07357c.cfargotunnel.com"
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "NostalgiaTV"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "jellyfin.png"
    gethomepage.dev/description: "Retro TV experience"
spec:
  rules:
  - host: ntv.yggdrasil.rip
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nostalgiatv
            port:
              number: 19850
