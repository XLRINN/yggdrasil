---
# Config + metadata (covers/scan cache/etc.) both live on this one small PVC,
# split by subPath - matches Audiobookshelf's own compose, which keeps /config
# and /metadata as two separate persistent dirs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: audiobookshelf-config-pvc
  namespace: knarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobookshelf
  namespace: knarr
  labels:
    app: audiobookshelf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobookshelf
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: audiobookshelf
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
      - name: audiobookshelf
        image: ghcr.io/advplyr/audiobookshelf:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/New_York"
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: config
          mountPath: /config
          subPath: config
        - name: config
          mountPath: /metadata
          subPath: metadata
        # Audiobookshelf does not support being served under a URL subpath
        # (unlike the Servarr apps above) - it only works at its own host,
        # so it's deliberately left out of knarr-paths-ingress.
        - name: media
          mountPath: /audiobooks
          subPath: audiobooks # <--- create /mnt/alexandria/poeticEdda/audiobooks on njord!
        - name: media
          mountPath: /podcasts
          subPath: podcasts # <--- create /mnt/alexandria/poeticEdda/podcasts on njord!
        - name: media
          mountPath: /mnt
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: audiobookshelf-config-pvc
      - name: media
        persistentVolumeClaim:
          claimName: media-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: audiobookshelf
  namespace: knarr
spec:
  selector:
    app: audiobookshelf
  ports:
  - port: 80
    targetPort: 80
    name: http
# No public Ingress here on purpose: audiobookshelf.yggdrasil.rip was routed
# through the Cloudflare tunnel behind the Odin Access wildcard (Google SSO),
# and the Audiobookshelf mobile app can't complete an interactive SSO
# redirect to log in (same class of problem as Jellyfin). Dropped from
# Cloudflare entirely; local network access remains via
# audiobookshelf.skadi.rip (apps/k8s/knarr/local-ingress.yaml).
