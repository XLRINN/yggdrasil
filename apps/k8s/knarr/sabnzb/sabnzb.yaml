apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: knarr
spec:
  replicas: 1
  strategy:
    type: Recreate

  # --- CRITICAL SECTION 1: THE SELECTOR ---
  # This tells the Deployment: "I own any pod with the tag app=sabnzbd"
  selector:
    matchLabels:
      app: sabnzbd

  template:
    metadata:
      # --- CRITICAL SECTION 2: THE LABELS ---
      # This puts the tag "app=sabnzbd" on the actual Pods
      labels:
        app: sabnzbd
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      initContainers:
      - name: sysctl-tuning
        image: busybox
        securityContext:
          privileged: true
        command:
        - sh
        - -c
        - |
          sysctl -w fs.inotify.max_user_watches=524288
          sysctl -w fs.inotify.max_user_instances=512
          sysctl -w net.ipv4.tcp_keepalive_time=60
          sysctl -w net.ipv4.tcp_keepalive_intvl=10
          sysctl -w net.ipv4.tcp_keepalive_probes=6
      - name: set-urlbase
        image: busybox
        command:
        - sh
        - -c
        - |
          CONFIG=/config/sabnzbd.ini
          if [ -f "$CONFIG" ]; then
            if grep -q 'url_base' "$CONFIG"; then
              sed -i 's|url_base = .*|url_base = /sab|g' "$CONFIG"
            else
              sed -i '/^\[misc\]/a url_base = /sab' "$CONFIG"
            fi
            if grep -q 'host_whitelist' "$CONFIG"; then
              sed -i 's|host_whitelist = .*|host_whitelist = yggdrasil.rip|g' "$CONFIG"
            else
              sed -i '/^\[misc\]/a host_whitelist = yggdrasil.rip' "$CONFIG"
            fi
            if grep -q 'complete_dir' "$CONFIG"; then
              sed -i 's|complete_dir = .*|complete_dir = /media/vikingr/completed|g' "$CONFIG"
            else
              sed -i '/^\[misc\]/a complete_dir = /media/vikingr/completed' "$CONFIG"
            fi
            if grep -q 'download_dir' "$CONFIG"; then
              sed -i 's|download_dir = .*|download_dir = /media/vikingr/incomplete|g' "$CONFIG"
            else
              sed -i '/^\[misc\]/a download_dir = /media/vikingr/incomplete' "$CONFIG"
            fi
          fi
        volumeMounts:
        - name: config
          mountPath: /config
      containers:
        - name: sabnzbd
          image: lscr.io/linuxserver/sabnzbd:latest
          ports:
            - containerPort: 8080
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "America/New_York"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: incomplete
              mountPath: /incomplete
            - name: media
              mountPath: /media
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
        - name: incomplete
          hostPath:
            path: /home/david/k8s/knarr/sabnzb/incomplete # <--- Create this folder on your host!
            type: DirectoryOrCreate

---
apiVersion: v1
kind: Service
metadata:
  name: sabnzbd
  namespace: knarr
spec:
  type: ClusterIP
  selector:
    app: sabnzbd
  ports:
    - port: 80
      targetPort: 8080

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sabnzbd-config-pvc
  namespace: knarr
  labels:
    recurring-job-group.longhorn.io/default: enabled
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
