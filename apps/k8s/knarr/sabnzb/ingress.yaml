apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sabnzbd-ingress
  namespace: knarr
  annotations:
    kubernetes.io/ingress.class: traefik
    cert-manager.io/cluster-issuer: letsencrypt-prod
    external-dns.alpha.kubernetes.io/hostname: sabnzbd.yggdrasil.rip
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "SABnzbd"
    gethomepage.dev/group: "Downloads"
    gethomepage.dev/icon: "sabnzbd.png"
    gethomepage.dev/description: "Usenet downloader"
spec:
  tls:
  - hosts:
    - sabnzbd.yggdrasil.rip
    secretName: sabnzbd-tls
  rules:
  - host: sabnzbd.yggdrasil.rip
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sabnzbd
            port:
              number: 80
