        - n8n:
            href: https://heimdal.rip/n8n
            icon: n8n.png
            description: Automation

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: admin
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homepage
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      initContainers:
        - name: copy-config
          image: busybox
          command:
            - sh
            - -c
            - cp /config-source/* /app/config/
          volumeMounts:
            - name: config-source
              mountPath: /config-source
            - name: config-writable
              mountPath: /app/config
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: TZ
              value: "America/New_York"
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "drip.heimdal.rip,heimdal.rip"
          volumeMounts:
            - name: config-writable
              mountPath: /app/config
      volumes:
        - name: config-source
          configMap:
            name: homepage-config
        - name: config-writable
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: admin
spec:
  selector:
    app: homepage
  ports:
    - port: 80
      targetPort: http
      name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage-ingress
  namespace: admin
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - heimdal.rip
    secretName: heimdal-rip-tls
  rules:
    - host: drip.heimdal.rip
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 80
    - host: heimdal.rip
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 80
