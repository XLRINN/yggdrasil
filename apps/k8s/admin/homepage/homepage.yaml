            href: https://heimdal.rip/sabnzbd
            icon: sabnzbd.png
            description: Usenet Downloader
            widget:
              type: sabnzbd
              url: http://sabnzbd.knarr.svc.cluster.local
              key: bd92a4d3915349479bf69e57a0de5849
        - Sonarr:
            href: https://heimdal.rip/sonarr
            icon: sonarr.png
            description: TV Shows
            widget:
              type: sonarr
              url: http://sonarr.knarr.svc.cluster.local
              key: d6384c35ad1744bfb4456ce5ca7ce051
        - Radarr:
            href: https://heimdal.rip/radarr
            icon: radarr.png
            description: Movies
            widget:
              type: radarr
              url: http://radarr.knarr.svc.cluster.local
              key: 5b243c724ced48489b8fe9456267ef32
        - Prowlarr:
            href: https://heimdal.rip/prowlarr
            icon: prowlarr.png
            description: Indexers
            widget:
              type: prowlarr
              url: http://prowlarr.knarr.svc.cluster.local
