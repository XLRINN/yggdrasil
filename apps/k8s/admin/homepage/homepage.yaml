            icon: jellyfin.png
            description: Media Server
            widget:
              type: jellyfin
              url: http://jellyfin.knarr.svc.cluster.local/jelly
              key: 3994e23ed5a847309e88a7bf8a160bd5
              enableBlocks: true
        - Tunarr:
            href: http://tunarr.drip.heimdal.rip
            icon: tunarr.png
            description: Live TV Channels

    - Downloads:
