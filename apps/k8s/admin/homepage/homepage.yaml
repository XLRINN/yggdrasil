---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  namespace: admin
data:
  settings.yaml: |
    title: Yggdrasil
    theme: dark
    color: slate
    headerStyle: clean
    allowedHosts: homepage.yggdrasil.rip,yggdrasil.rip
    layout:
      Network:
        style: row
        columns: 4
      Storage:
        style: row
        columns: 4
      Media:
        style: row
        columns: 2
      Downloads:
        style: row
        columns: 4
      Requests:
        style: row
        columns: 2
      Infrastructure:
        style: row
        columns: 4
      Finance:
        style: row
        columns: 4

  widgets.yaml: |
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          dateStyle: short
          hour12: true

  bookmarks.yaml: |
    []

  kubernetes.yaml: |
    mode: cluster

  services.yaml: |
    - Network:
        - Proxmox:
            href: https://asgard.yggdrasil.rip
            icon: proxmox.png
            description: Hypervisor
            widget:
              type: proxmox
              url: https://192.168.69.69:8006
              username: root@pam!homepage
              password: ${PROXMOX_HOMEPAGE_PASSWORD}
        - Pi-hole:
            href: https://yggdrasil.rip/pihole/admin
            icon: pi-hole.png
            description: DNS & Ad Blocker
        - Cloudflared:
            href: https://one.dash.cloudflare.com
            icon: cloudflare.png
            description: Tunnel

    - Storage:
        - Filebrowser:
            href: https://files.yggdrasil.rip
            icon: filebrowser.png
            description: Web File Manager
        - Syncthing:
            href: https://syncthing-alex.yggdrasil.rip
            icon: syncthing.png
            description: File Sync — Alexandria

    - Media:
        - Jellyfin:
            href: https://yggdrasil.rip/jelly
            icon: jellyfin.png
            description: Media Server
            widget:
              type: jellyfin
              url: http://jellyfin.knarr.svc.cluster.local/jelly
              key: ${JELLYFIN_API_KEY}
              enableBlocks: true
        - Tunarr:
            href: https://tunarr.yggdrasil.rip
            icon: tunarr.png
            description: Live TV Channels

    - Downloads:
        - SABnzbd:
            href: https://yggdrasil.rip/sab
            icon: sabnzbd.png
            description: Usenet Downloader
            widget:
              type: sabnzbd
              url: http://sabnzbd.knarr.svc.cluster.local/sab
              key: ${SABNZBD_API_KEY}
        - Sonarr:
            href: https://yggdrasil.rip/sonarr
            icon: sonarr.png
            description: TV Shows
            widget:
              type: sonarr
              url: http://sonarr.knarr.svc.cluster.local/sonarr
              key: ${SONARR_API_KEY}
        - Radarr:
            href: https://yggdrasil.rip/radarr
            icon: radarr.png
            description: Movies
            widget:
              type: radarr
              url: http://radarr.knarr.svc.cluster.local/radarr
              key: ${RADARR_API_KEY}
        - Prowlarr:
            href: https://yggdrasil.rip/prowlarr
            icon: prowlarr.png
            description: Indexers
            widget:
              type: prowlarr
              url: http://prowlarr.knarr.svc.cluster.local/prowlarr
              key: ${PROWLARR_API_KEY}
        - Anime:
            href: https://yggdrasil.rip/crunchy
            icon: sonarr.png
            description: Anime
            widget:
              type: sonarr
              url: http://sonarr-anime.knarr.svc.cluster.local/crunchy
              key: ${SONARR_ANIME_API_KEY}
        - Lidarr:
            href: https://yggdrasil.rip/lidarr
            icon: lidarr.png
            description: Music Manager
            widget:
              type: lidarr
              url: http://lidarr.knarr.svc.cluster.local/lidarr
              key: ${LIDARR_API_KEY}

    - Requests:
        - Seer:
            href: https://yggdrasil.rip/seer
            icon: overseerr.png
            description: Media Requests
            widget:
              type: overseerr
              url: http://seer.knarr.svc.cluster.local/seer
              key: ${SEER_API_KEY}

    - Infrastructure:
        - Longhorn:
            href: https://longhorn.yggdrasil.rip
            icon: longhorn.png
            description: Storage
        - n8n:
            href: https://n8n.yggdrasil.rip
            icon: n8n.png
            description: Automation

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homepage
  namespace: admin
  labels:
    app.kubernetes.io/name: homepage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
      - pods
      - nodes
    verbs:
      - get
      - list
  - apiGroups:
      - extensions
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: homepage
  labels:
    app.kubernetes.io/name: homepage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: homepage
subjects:
  - kind: ServiceAccount
    name: homepage
    namespace: admin
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: admin
  labels:
    app: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: homepage
    spec:
      serviceAccountName: homepage
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: TZ
              value: "America/New_York"
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "homepage.yggdrasil.rip,yggdrasil.rip"
            - name: PROXMOX_HOMEPAGE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: proxmox_homepage_password
            - name: JELLYFIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: jellyfin_api_key
            - name: SABNZBD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: sabnzbd_api_key
            - name: SONARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: sonarr_api_key
            - name: RADARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: radarr_api_key
            - name: PROWLARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: prowlarr_api_key
            - name: SONARR_ANIME_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: sonarr_anime_api_key
            - name: LIDARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: lidarr_api_key
            - name: SEER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: seer_api_key
          volumeMounts:
            - name: config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
            - name: config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
      volumes:
        - name: config
          configMap:
            name: homepage-config

---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: admin
spec:
  selector:
    app: homepage
  ports:
    - port: 80
      targetPort: http
      name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage-ingress
  namespace: admin
  annotations:
    kubernetes.io/ingress.class: traefik
    external-dns.alpha.kubernetes.io/target: "14dba35c-b082-4cf5-8319-05b87f07357c.cfargotunnel.com"
spec:
  rules:
    - host: yggdrasil.rip
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 80
    - host: homepage.yggdrasil.rip
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homepage
                port:
                  number: 80
