apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: admin
data:
  config.yaml: |
    tunnel: <TUNNEL_ID>
    credentials-file: /etc/cloudflared/creds/credentials.json
    ingress:
      - hostname: "*.yggdrasil.rip"
        service: https://traefik.kube-system.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
      - hostname: yggdrasil.rip
        service: https://traefik.kube-system.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
      - service: http_status:404
