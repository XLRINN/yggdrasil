apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: admin
data:
  config.yaml: |
    ingress:
      - hostname: "*.drip.heimdal.rip"
        service: https://traefik.kube-system.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
      - hostname: "*.heimdal.rip"
        service: https://traefik.kube-system.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
      - hostname: heimdal.rip
        service: https://traefik.kube-system.svc.cluster.local:443
        originRequest:
          noTLSVerify: true
      - service: http_status:404
