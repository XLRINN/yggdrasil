      hosts:
        pihole:
          ansible_host: 192.168.69.2
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
        cloudflared:
          ansible_host: 192.168.69.3
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
