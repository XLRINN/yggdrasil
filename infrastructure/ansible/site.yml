---
# =============================================================================
# YGGDRASIL — ANSIBLE SITE PLAYBOOK
# =============================================================================
#
# USAGE:
#   All hosts:          ansible-playbook site.yml
#   Core only:          ansible-playbook site.yml --limit core
#   Network only:       ansible-playbook site.yml --limit network
#   Single host:        ansible-playbook site.yml --limit draupnir
#
# GROUPS:
#   core     — draupnir (k8s) + alexandria (NAS) + vuln + code (code-server) + host (Nexterm) + immich — frequently rebuilt
#   network  — pihole + cloudflared — stable, survive core rebuilds
#
# SECRETS:
#   vars/secrets.yml — ansible-vault encrypted, see vars/secrets.yml.example
#   vars/services.yml — plain text, source of truth for non-k8s services

# -----------------------------------------------------------------------------
# NETWORK — Run first so DNS and tunnel are up before core services need them
# -----------------------------------------------------------------------------

- name: Configure pihole
  hosts: pihole
  become: true
  vars_files:
    - vars/secrets.yml
    - vars/services.yml
  roles:
    - pihole

- name: Configure cloudflared and homepage
  hosts: cloudflared
  become: true
  vars_files:
    - vars/secrets.yml
    - vars/services.yml
  roles:
    - cloudflared

# -----------------------------------------------------------------------------
# CORE — Alexandria first so NFS is ready before draupnir mounts it
# -----------------------------------------------------------------------------

- name: Configure alexandria
  hosts: alexandria
  become: true
  vars_files:
    - vars/secrets.yml
  roles:
    - tailscale
    - fileshare
    - claude_cli

- name: Configure draupnir
  hosts: draupnir
  become: true
  vars_files:
    - vars/secrets.yml
  roles:
    - common
    - tailscale
    - k3s
    - k8s_tools
    - nfs_mount
    - rclone_mount
    - longhorn
    - flux_bootstrap
    - longhorn_restore
    - claude_cli

# -------------------------------------------------------------------------
# HERMOD — MCP connector host (sequence, budget, mail, ...)
# -------------------------------------------------------------------------

- name: Configure hermod
  hosts: hermod
  become: true
  vars_files:
    - vars/secrets.yml
    - vars/mcp_servers.yml
  roles:
    - common
    - tailscale
    - mcp
    - claude_cli

# -------------------------------------------------------------------------
# VULN — Docker + Tailscale test container
# -------------------------------------------------------------------------

- name: Configure vuln
  hosts: vuln
  become: true
  vars_files:
    - vars/secrets.yml
  roles:
    - common
    - docker
    - tailscale
    - users

# -------------------------------------------------------------------------
# CODE — code-server (VS Code in the browser) dev box
# -------------------------------------------------------------------------

- name: Configure code
  hosts: code
  become: true
  vars_files:
    - vars/secrets.yml
  roles:
    - common
    - tailscale
    - alexandria_mount
    - users
    - claude_cli
    - code_server

# -------------------------------------------------------------------------
# HOST — Nexterm (web SSH/SFTP/RDP/VNC with jump hosts)
# -------------------------------------------------------------------------

- name: Configure host
  hosts: host
  become: true
  vars_files:
    - vars/secrets.yml
  roles:
    - common
    - tailscale
    - docker
    - nexterm

# -------------------------------------------------------------------------
# IMMICH — photo/video backup; library on alexandria
# -------------------------------------------------------------------------

- name: Configure immich
  hosts: immich
  become: true
  vars_files:
    - vars/secrets.yml
  roles:
    - common
    - tailscale
    - alexandria_mount
    - docker
    - immich
