# =============================================================================
# YGGDRASIL — MCP SERVER REGISTRY (hosted on hermod, 192.168.69.50)
# =============================================================================
#
# Each entry runs as its own systemd service (node/npx) behind Caddy, which
# reverse-proxies the public hostname to the local port over HTTPS.
#
# Add a new MCP server by appending an entry here — no role changes needed.
#
#   name      Short identifier — used for the systemd unit and local routing
#   hostname  Public hostname (Cloudflare tunnel must route here)
#   port      Local port the server listens on (keep these unique)
#   command   Command used to launch the server (npx, node, docker run, etc.)
#   env       Map of environment variables (secrets pulled from secrets.yml)
#
# =============================================================================

mcp_servers:
  # Sequence (getsequence.io) personal finance router. Their MCP server is
  # hosted remotely at app.getsequence.io/api/mcp — nothing to run locally
  # except an OAuth shim for claude.ai's connector flow. Caddy validates the
  # shim-issued bearer token and swaps in the real Sequence API key.
  - name: sequence
    hostname: sequence-mcp.yggdrasil.rip
    port: 3001
    command: "/usr/bin/python3 /opt/mcp/sequence/oauth-shim.py"
    files:
      - src: oauth-shim-server.py
        dest: oauth-shim.py
    env:
      BASE_URL: "https://sequence-mcp.yggdrasil.rip"
      ACCESS_TOKEN: "{{ sequence_mcp_access_token }}"
      CLIENT_SECRET: "{{ sequence_mcp_client_secret }}"
      CLIENT_ID: "sequence-mcp"
      SERVICE_LABEL: "Sequence MCP"
    caddy_config: |
      handle /.well-known/oauth-authorization-server {
          reverse_proxy 127.0.0.1:3001
      }
      handle /.well-known/oauth-protected-resource {
          reverse_proxy 127.0.0.1:3001
      }
      handle /oauth/* {
          reverse_proxy 127.0.0.1:3001
      }
      handle /api/mcp* {
          @valid   header     Authorization "Bearer {{ sequence_mcp_access_token }}"
          @invalid not header Authorization "Bearer {{ sequence_mcp_access_token }}"
          handle @valid {
              reverse_proxy https://app.getsequence.io {
                  header_up Host app.getsequence.io
                  header_up Authorization "Bearer {{ sequence_api_key }}"
                  flush_interval -1
              }
          }
          handle @invalid {
              header WWW-Authenticate `Bearer realm="Sequence MCP", resource_metadata="https://sequence-mcp.yggdrasil.rip/.well-known/oauth-protected-resource"`
              respond 401
          }
      }
      respond 404

  # Actual Budget MCP server runs locally and enforces its own static bearer
  # token (actual_mcp_token). budget-oauth below gives it the same zero-touch
  # OAuth connector flow as Sequence: Caddy checks the shim-issued token and
  # swaps in the real actual_mcp_token when it forwards to localhost:3002.
  - name: budget
    hostname: budget-mcp.yggdrasil.rip
    port: 3002
    command: "npx -y actual-mcp-server --http"
    env:
      ACTUAL_SERVER_URL: "https://ab.yggdrasil.rip"
      ACTUAL_PASSWORD: "{{ proxmox_password }}"
      ACTUAL_BUDGET_SYNC_ID: "{{ actual_budget_sync_id }}"
      MCP_BRIDGE_PORT: "3002"
      MCP_BRIDGE_DATA_DIR: "/opt/mcp/budget/actual-data"
      MCP_SSE_AUTHORIZATION: "{{ actual_mcp_token }}"
    caddy_config: |
      handle /.well-known/oauth-authorization-server {
          reverse_proxy 127.0.0.1:3003
      }
      handle /.well-known/oauth-protected-resource {
          reverse_proxy 127.0.0.1:3003
      }
      handle /oauth/* {
          reverse_proxy 127.0.0.1:3003
      }
      handle /health {
          reverse_proxy localhost:3002
      }
      handle /http* {
          @valid   header     Authorization "Bearer {{ budget_mcp_access_token }}"
          @invalid not header Authorization "Bearer {{ budget_mcp_access_token }}"
          handle @valid {
              reverse_proxy localhost:3002 {
                  header_up Authorization "Bearer {{ actual_mcp_token }}"
              }
          }
          handle @invalid {
              header WWW-Authenticate `Bearer realm="Actual Budget MCP", resource_metadata="https://budget-mcp.yggdrasil.rip/.well-known/oauth-protected-resource"`
              respond 401
          }
      }
      respond 404

  # Internal-only OAuth shim for budget above — no public Caddy vhost of its
  # own (internal: true), reached only via the reverse_proxy calls in
  # budget's caddy_config.
  - name: budget-oauth
    internal: true
    port: 3003
    command: "/usr/bin/python3 /opt/mcp/budget-oauth/oauth-shim.py"
    files:
      - src: oauth-shim-server.py
        dest: oauth-shim.py
    env:
      BASE_URL: "https://budget-mcp.yggdrasil.rip"
      ACCESS_TOKEN: "{{ budget_mcp_access_token }}"
      CLIENT_SECRET: "{{ budget_mcp_client_secret }}"
      CLIENT_ID: "budget-mcp"
      SERVICE_LABEL: "Actual Budget MCP"

