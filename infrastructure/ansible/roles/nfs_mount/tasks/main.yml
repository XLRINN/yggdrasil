---
- name: Install NFS client and server
  apt:
    name:
      - nfs-common
      - nfs-kernel-server
    state: present

- name: Create njord media mount point
  file:
    path: /mnt/njord
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create alexandria mount point
  file:
    path: /mnt/alexandria
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mount alexandria NFS share
  mount:
    path: /mnt/alexandria
    src: 192.168.69.5:/mnt/mimmis
    fstype: nfs
    opts: rw,sync,soft,timeo=30,retrans=3,_netdev,nofail,nofsc
    state: mounted

- name: Enable and start nfs-kernel-server
  systemd:
    name: nfs-kernel-server
    enabled: true
    state: started

