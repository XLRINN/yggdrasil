---
- name: Install NFS client and server
  apt:
    name:
      - nfs-common
      - nfs-kernel-server
    state: present

- name: Create njord media mount point
  file:
    path: /mnt/njord
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create alexandria mount point
  file:
    path: /mnt/alexandria
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mount alexandria NFS share
  mount:
    path: /mnt/alexandria
    src: 192.168.69.5:/mnt/mimmis
    fstype: nfs
    opts: rw,sync,hard,intr
    state: mounted

- name: Create longhorn backup mount point
  file:
    path: /mnt/longhorn
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Export /mnt/longhorn via NFS for Longhorn backups
  copy:
    dest: /etc/exports.d/longhorn.exports
    content: "/mnt/longhorn 192.168.69.0/24(rw,sync,no_subtree_check,no_root_squash)\n"
    owner: root
    group: root
    mode: "0644"
  notify: reload nfs exports

- name: Enable and start nfs-kernel-server
  systemd:
    name: nfs-kernel-server
    enabled: true
    state: started

