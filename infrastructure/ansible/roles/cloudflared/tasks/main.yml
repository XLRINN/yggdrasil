---
# Cloudflared + Homepage role
# Manages the Cloudflare tunnel and Homepage dashboard on the cloudflared LXC
#
# SECRETS REQUIRED in vars/secrets.yml:
#   cloudflare_tunnel_token — token from Cloudflare Zero Trust → Tunnels → your tunnel → Overview
#   cloudflare_tunnel_id    — tunnel ID from the same page
#
# HOW TO GET THESE:
#   1. Go to Cloudflare Zero Trust → Networks → Tunnels
#   2. Click your tunnel → Overview tab
#   3. Copy the Tunnel ID
#   4. Copy the token from the install command (the long base64 string after 'service install')
#   5. Add both to secrets.yml via: ansible-vault edit vars/secrets.yml

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install dependencies
  apt:
    name:
      - curl
      - apt-transport-https
      - gnupg
    state: present

# --- Cloudflared ---

- name: Add Cloudflare GPG key
  shell: >
    curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg |
    gpg --dearmor -o /usr/share/keyrings/cloudflare-main.gpg
  args:
    creates: /usr/share/keyrings/cloudflare-main.gpg

- name: Add Cloudflare apt repository
  copy:
    dest: /etc/apt/sources.list.d/cloudflared.list
    content: |
      deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main

- name: Install cloudflared
  apt:
    name: cloudflared
    state: present
    update_cache: true

- name: Create cloudflared config directory
  file:
    path: /etc/cloudflared
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write tunnel credentials file
  copy:
    dest: /etc/cloudflared/credentials.json
    content: "{{ cloudflare_credentials_json }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart cloudflared

- name: Generate cloudflared config from services registry
  template:
    src: config.yaml.j2
    dest: /etc/cloudflared/config.yaml
    owner: root
    group: root
    mode: "0644"
  notify: restart cloudflared

- name: Install cloudflared systemd service
  copy:
    dest: /etc/systemd/system/cloudflared.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=cloudflared
      After=network.target

      [Service]
      Type=simple
      ExecStart=/usr/bin/cloudflared --no-autoupdate --config /etc/cloudflared/config.yaml tunnel run
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
  notify: restart cloudflared

- name: Enable and start cloudflared
  systemd:
    name: cloudflared
    enabled: true
    state: started
    daemon_reload: true

# --- Cloudflare DNS (non-k8s services from services.yml) ---

- name: Install python3-pip for Cloudflare DNS module
  apt:
    name: python3-pip
    state: present

- name: Install cloudflare python library
  pip:
    name: cloudflare
    state: present
    extra_args: --break-system-packages

- name: Create Cloudflare DNS CNAME records for non-k8s services
  community.general.cloudflare_dns:
    zone: yggdrasil.rip
    record: "{{ item.hostname | regex_replace('\\.yggdrasil\\.rip$', '') }}"
    type: CNAME
    value: "{{ cloudflare_tunnel_id }}.cfargotunnel.com"
    proxied: true
    api_token: "{{ cloudflare_api_token }}"
    state: present
  loop: "{{ services }}"
  no_log: true
