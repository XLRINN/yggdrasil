---
# Cloudflared + Homepage role
# Manages the Cloudflare tunnel and Homepage dashboard on the cloudflared LXC
#
# SECRETS REQUIRED in vars/secrets.yml:
#   cloudflare_tunnel_token — token from Cloudflare Zero Trust → Tunnels → your tunnel → Overview
#   cloudflare_tunnel_id    — tunnel ID from the same page
#
# HOW TO GET THESE:
#   1. Go to Cloudflare Zero Trust → Networks → Tunnels
#   2. Click your tunnel → Overview tab
#   3. Copy the Tunnel ID
#   4. Copy the token from the install command (the long base64 string after 'service install')
#   5. Add both to secrets.yml via: ansible-vault edit vars/secrets.yml

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install dependencies
  apt:
    name:
      - curl
      - apt-transport-https
      - gnupg
    state: present

# --- Cloudflared ---

- name: Add Cloudflare GPG key
  shell: >
    curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg |
    gpg --dearmor -o /usr/share/keyrings/cloudflare-main.gpg
  args:
    creates: /usr/share/keyrings/cloudflare-main.gpg

- name: Add Cloudflare apt repository
  copy:
    dest: /etc/apt/sources.list.d/cloudflared.list
    content: |
      deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main

- name: Install cloudflared
  apt:
    name: cloudflared
    state: present
    update_cache: true

- name: Create cloudflared config directory
  file:
    path: /etc/cloudflared
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install cloudflared service via token to generate credentials
  command: cloudflared service install {{ cloudflare_tunnel_token }}
  args:
    creates: /etc/systemd/system/cloudflared.service
  ignore_errors: true

- name: Stop cloudflared to reconfigure it
  systemd:
    name: cloudflared
    state: stopped
    daemon_reload: true
  ignore_errors: true

- name: Find generated credentials file
  find:
    paths:
      - /etc/cloudflared
      - /root/.cloudflared
    patterns: "*.json"
    excludes: "credentials.json"
  register: cred_files

- name: Copy generated credentials to standard location
  copy:
    src: "{{ cred_files.files[0].path }}"
    dest: /etc/cloudflared/credentials.json
    owner: root
    group: root
    mode: "0600"
    remote_src: true
  when: cred_files.files | length > 0

- name: Generate cloudflared config from services registry
  template:
    src: config.yaml.j2
    dest: /etc/cloudflared/config.yaml
    owner: root
    group: root
    mode: "0644"

- name: Update cloudflared service to use config file
  copy:
    dest: /etc/systemd/system/cloudflared.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=cloudflared
      After=network.target

      [Service]
      TimeoutStartSec=0
      Type=notify
      ExecStart=/usr/bin/cloudflared --no-autoupdate --config /etc/cloudflared/config.yaml tunnel run
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
  notify: restart cloudflared

- name: Enable and start cloudflared
  systemd:
    name: cloudflared
    enabled: true
    state: started
    daemon_reload: true

# --- Docker (for Homepage) ---

- name: Install Docker
  shell: >
    curl -fsSL https://get.docker.com | sh
  args:
    creates: /usr/bin/docker

- name: Enable and start Docker
  systemd:
    name: docker
    enabled: true
    state: started

# --- Homepage ---

- name: Create Homepage config directory
  file:
    path: /etc/homepage
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Generate Homepage services config from services registry
  template:
    src: services.yaml.j2
    dest: /etc/homepage/services.yaml
    owner: root
    group: root
    mode: "0644"
  notify: restart homepage

- name: Write Homepage settings
  template:
    src: homepage-settings.yaml.j2
    dest: /etc/homepage/settings.yaml
    owner: root
    group: root
    mode: "0644"
  notify: restart homepage

- name: Fetch kubeconfig from draupnir for k8s auto-discovery
  fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /tmp/draupnir-kubeconfig
    flat: true
  delegate_to: draupnir
  ignore_errors: true
  register: kubeconfig_fetch

- name: Fix kubeconfig server address (replace localhost with draupnir IP)
  replace:
    path: /tmp/draupnir-kubeconfig
    regexp: 'https://127\.0\.0\.1:6443'
    replace: 'https://192.168.69.77:6443'
  delegate_to: localhost
  when: kubeconfig_fetch is succeeded

- name: Copy kubeconfig to Homepage config directory
  copy:
    src: /tmp/draupnir-kubeconfig
    dest: /etc/homepage/kubeconfig.yaml
    owner: root
    group: root
    mode: "0600"
  notify: restart homepage
  when: kubeconfig_fetch is succeeded

- name: Write Homepage kubernetes integration config
  copy:
    dest: /etc/homepage/kubernetes.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      # Kubernetes integration — auto-discovers services via Ingress annotations
      # Reads from kubeconfig.yaml which points to draupnir's k3s API
      mode: default
  notify: restart homepage

- name: Install Homepage systemd service
  copy:
    dest: /etc/systemd/system/homepage.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Homepage Dashboard
      After=docker.service
      Requires=docker.service

      [Service]
      Type=simple
      ExecStartPre=-/usr/bin/docker rm -f homepage
      ExecStart=/usr/bin/docker run --rm \
        --name homepage \
        -p 3000:3000 \
        -v /etc/homepage:/app/config \
        ghcr.io/gethomepage/homepage:latest
      ExecStop=/usr/bin/docker stop homepage
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target
  notify: restart homepage

- name: Enable and start Homepage
  systemd:
    name: homepage
    enabled: true
    state: started
    daemon_reload: true

# --- Cloudflare DNS (non-k8s services from services.yml) ---

- name: Install python3-pip for Cloudflare DNS module
  apt:
    name: python3-pip
    state: present

- name: Install cloudflare python library
  pip:
    name: cloudflare
    state: present
    extra_args: --break-system-packages

- name: Create Cloudflare DNS CNAME records for non-k8s services
  community.general.cloudflare_dns:
    zone: yggdrasil.rip
    record: "{{ item.hostname | regex_replace('\\.yggdrasil\\.rip$', '') }}"
    type: CNAME
    value: "{{ cloudflare_tunnel_id }}.cfargotunnel.com"
    proxied: true
    api_token: "{{ cloudflare_api_token }}"
    state: present
  loop: "{{ services }}"
  no_log: true
