---
# Cloudflared role
# Manages the Cloudflare tunnel on the cloudflared LXC.
# Homepage is deployed via Flux on k8s (apps/k8s/admin/homepage/).
#
# SECRETS REQUIRED in vars/secrets.yml:
#   cloudflare_tunnel_token        — token from Zero Trust → Tunnels → your tunnel → Overview
#   cloudflare_tunnel_id           — tunnel ID from the same page
#   cloudflare_credentials_json    — credentials.json content (AccountTag, TunnelSecret, TunnelID)
#   cloudflare_tunnel_manager_token — account token with Cloudflare Tunnel Write permission
#   cloudflare_api_token           — zone token for DNS record management

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install dependencies
  apt:
    name:
      - curl
      - apt-transport-https
      - gnupg
    state: present

# --- Cloudflared ---

- name: Add Cloudflare GPG key
  shell: >
    curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg |
    gpg --dearmor -o /usr/share/keyrings/cloudflare-main.gpg
  args:
    creates: /usr/share/keyrings/cloudflare-main.gpg

- name: Add Cloudflare apt repository
  copy:
    dest: /etc/apt/sources.list.d/cloudflared.list
    content: |
      deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main

- name: Install cloudflared
  apt:
    name: cloudflared
    state: present
    update_cache: true

- name: Create cloudflared config directory
  file:
    path: /etc/cloudflared
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Write tunnel credentials file
  copy:
    dest: /etc/cloudflared/credentials.json
    content: "{{ cloudflare_credentials_json }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: restart cloudflared

- name: Generate cloudflared config from services registry
  template:
    src: config.yaml.j2
    dest: /etc/cloudflared/config.yaml
    owner: root
    group: root
    mode: "0644"
  notify: restart cloudflared

- name: Install cloudflared systemd service
  copy:
    dest: /etc/systemd/system/cloudflared.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=cloudflared
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=simple
      ExecStart=/usr/bin/cloudflared --no-autoupdate --config /etc/cloudflared/config.yaml tunnel run
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
  notify: restart cloudflared

- name: Enable and start cloudflared
  systemd:
    name: cloudflared
    enabled: true
    state: started
    daemon_reload: true

# --- Cloudflare DNS (non-k8s services from services.yml) ---

- name: Install python3-pip for Cloudflare DNS module
  apt:
    name: python3-pip
    state: present

- name: Install cloudflare python library
  pip:
    name: cloudflare
    state: present
    extra_args: --break-system-packages

- name: Create Cloudflare DNS CNAME records for non-k8s services
  community.general.cloudflare_dns:
    zone: yggdrasil.rip
    record: "{{ item.hostname | regex_replace('\\.yggdrasil\\.rip$', '') }}"
    type: CNAME
    value: "{{ cloudflare_tunnel_id }}.cfargotunnel.com"
    proxied: true
    api_token: "{{ cloudflare_api_token }}"
    state: present
  loop: "{{ services }}"
  no_log: true

# --- Cloudflare Tunnel remote config sync ---
# The dashboard pushes remote ingress config to cloudflared, overriding local config.yaml.
# This task keeps the remote config in sync with services.yml so they always match.

- name: Build tunnel ingress rules from services registry
  set_fact:
    _tunnel_ingress: >-
      {%- set rules = [] -%}
      {%- for s in services -%}
        {%- set rule = {'hostname': s.hostname, 'service': s.protocol + '://' + s.ip + ':' + (s.port | string)} -%}
        {%- if not (s.tls_verify | default(true)) -%}
          {%- set rule = rule | combine({'originRequest': {'noTLSVerify': true}}) -%}
        {%- endif -%}
        {%- set _ = rules.append(rule) -%}
      {%- endfor -%}
      {%- set _ = rules.append({'service': 'http://192.168.69.77:80'}) -%}
      {{ rules }}

- name: Push tunnel ingress config to Cloudflare API
  uri:
    url: "https://api.cloudflare.com/client/v4/accounts/aef72cd455cdee622a7ac143537e23e8/cfd_tunnel/{{ cloudflare_tunnel_id }}/configurations"
    method: PUT
    headers:
      Authorization: "Bearer {{ cloudflare_tunnel_manager_token }}"
    body_format: json
    body:
      config:
        ingress: "{{ _tunnel_ingress }}"
        warp-routing:
          enabled: true
    status_code: 200
  no_log: true
