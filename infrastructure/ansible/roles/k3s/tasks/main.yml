---
- name: Create k3s config directory
  file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write k3s config
  copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      write-kubeconfig-mode: "0644"

- name: Install k3s
  shell: curl -sfL https://get.k3s.io | sh -
  args:
    creates: /usr/local/bin/k3s

- name: Wait for k3s to be ready
  command: k3s kubectl wait --for=condition=Ready node --all --timeout=120s
  retries: 5
  delay: 10

- name: Create .kube directory for david
  file:
    path: /home/david/.kube
    state: directory
    owner: david
    group: david
    mode: "0700"

- name: Copy kubeconfig for david
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/david/.kube/config
    remote_src: true
    owner: david
    group: david
    mode: "0600"
