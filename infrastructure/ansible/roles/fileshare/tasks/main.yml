---
- name: Create david user
  user:
    name: david
    shell: /bin/bash
    groups:
      - sudo
      - nogroup
    append: true
    create_home: true
    state: present

- name: Add SSH key for david
  authorized_key:
    user: david
    key: "{{ ssh_public_key }}"
    state: present

- name: Allow david passwordless sudo
  copy:
    dest: /etc/sudoers.d/david
    content: "david ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"

- name: Stop and disable systemd-resolved
  systemd:
    name: systemd-resolved
    state: stopped
    enabled: false
  ignore_errors: true

- name: Write static resolv.conf
  shell: |
    rm -f /etc/resolv.conf
    echo "nameserver 1.1.1.1" > /etc/resolv.conf
    echo "nameserver 8.8.8.8" >> /etc/resolv.conf
  changed_when: true

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install NFS, Samba, and base utilities
  apt:
    name:
      - nfs-kernel-server
      - samba
      - avahi-daemon
      - acl
      - rclone
      - aria2
      - curl
      - git
      - wget
      - unzip
      - neovim
      - tmux
    state: present

- name: Ensure /mnt/mimmis is writable by david
  file:
    path: /mnt/mimmis
    owner: david
    group: david
    mode: "0775"
    state: directory

- name: Set ownership of /mnt/mimmis contents to david
  command: chown -R david:david /mnt/mimmis
  changed_when: false

- name: Configure NFS exports
  template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: "0644"
  notify: reload nfs exports

- name: Enable and start rpcbind
  systemd:
    name: rpcbind
    enabled: true
    state: started

- name: Set NFS thread count to 32
  lineinfile:
    path: /etc/nfs.conf
    regexp: '^#?\s*threads='
    line: "threads=32"
    insertafter: '^\[nfsd\]'
  notify: restart nfs

- name: Enable and start nfs-kernel-server
  systemd:
    name: nfs-kernel-server
    enabled: true
    state: started

- name: Reload NFS exports
  command: exportfs -ra
  changed_when: false

- name: Deploy Avahi NFS service advertisement
  template:
    src: avahi-nfs.service.j2
    dest: /etc/avahi/services/nfs.service
    owner: root
    group: root
    mode: "0644"
  notify: restart avahi

- name: Enable and start avahi-daemon
  systemd:
    name: avahi-daemon
    enabled: true
    state: started

- name: Configure Samba
  template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: "0644"
  notify: restart samba

- name: Set Samba password for david
  shell: >
    (echo {{ proxmox_password }}; echo {{ proxmox_password }}) | smbpasswd -a -s david
  no_log: true
  changed_when: false

- name: Enable and start Samba services
  systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - smbd
    - nmbd

- name: Ensure rclone config directory exists
  file:
    path: /root/.config/rclone
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Obscure rclone SFTP password
  command: rclone obscure "{{ proxmox_password }}"
  register: rclone_obscured_pass
  changed_when: false
  no_log: true

- name: Write rclone config
  copy:
    dest: /root/.config/rclone/rclone.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      [njord]
      type = sftp
      host = vana
      user = root
      pass = {{ rclone_obscured_pass.stdout }}
      shell_type = unix
      md5sum_command = md5sum
      sha1sum_command = sha1sum

- name: Install fuse3
  apt:
    name: fuse3
    state: present

- name: Allow fuse mounts by non-root
  lineinfile:
    path: /etc/fuse.conf
    line: "user_allow_other"
    state: present

- name: Install rclone systemd service for njord
  template:
    src: rclone-njord.service.j2
    dest: /etc/systemd/system/rclone-njord.service
    owner: root
    group: root
    mode: "0644"
  notify: reload systemd

- name: Enable rclone njord mount
  systemd:
    name: rclone-njord
    enabled: true
    daemon_reload: true

- name: Start rclone njord mount
  systemd:
    name: rclone-njord
    state: started
  ignore_errors: true

- name: Download Filebrowser install script
  get_url:
    url: https://raw.githubusercontent.com/filebrowser/get/master/get.sh
    dest: /tmp/filebrowser-get.sh
    mode: "0755"

- name: Install Filebrowser
  command: bash /tmp/filebrowser-get.sh
  args:
    creates: /usr/local/bin/filebrowser

- name: Create Filebrowser config directory
  file:
    path: /etc/filebrowser
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure Filebrowser
  copy:
    dest: /etc/filebrowser/filebrowser.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "port": 8080,
        "baseURL": "",
        "address": "0.0.0.0",
        "log": "stdout",
        "database": "/etc/filebrowser/filebrowser.db",
        "root": "/mnt/mimmis"
      }

- name: Install Filebrowser systemd service
  copy:
    dest: /etc/systemd/system/filebrowser.service
    owner: root
    group: root
    mode: "0644"
    content: |
      [Unit]
      Description=Filebrowser
      After=network.target

      [Service]
      Type=simple
      ExecStart=/usr/local/bin/filebrowser -c /etc/filebrowser/filebrowser.json
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  notify: reload systemd

- name: Initialise Filebrowser database if absent
  command: filebrowser -c /etc/filebrowser/filebrowser.json config init
  args:
    creates: /etc/filebrowser/filebrowser.db

- name: Create Filebrowser admin user
  shell: >
    filebrowser -c /etc/filebrowser/filebrowser.json
    users add david '{{ filebrowser_password }}' --perm.admin
  no_log: true
  ignore_errors: true

- name: Enable and start Filebrowser
  systemd:
    name: filebrowser
    enabled: true
    state: started
    daemon_reload: true

- name: Install Syncthing
  apt:
    name: syncthing
    state: present

- name: Ensure Syncthing config directory exists
  file:
    path: /home/david/.local/state/syncthing
    state: directory
    owner: david
    group: david
    mode: "0700"

- name: Enable and start Syncthing for david
  systemd:
    name: syncthing@david
    enabled: true
    state: started

- name: Wait for Syncthing to generate config
  wait_for:
    path: /home/david/.local/state/syncthing/config.xml
    state: present
    timeout: 120
  ignore_errors: true

- name: Set Syncthing GUI to listen on all interfaces
  replace:
    path: /home/david/.local/state/syncthing/config.xml
    regexp: '<address>127\.0\.0\.1:8384</address>'
    replace: '<address>0.0.0.0:8384</address>'
  notify: restart syncthing
