---
# NFS client mount of alexandria's mimmisbrunnr share — same mount as
# draupnir's nfs_mount role, without the NFS server / njord bits.

- name: Install NFS client
  apt:
    name: nfs-common
    state: present

- name: Create alexandria mount point
  file:
    path: /mnt/alexandria
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mount alexandria NFS share
  mount:
    path: /mnt/alexandria
    src: 192.168.69.5:/mnt/mimmis
    fstype: nfs
    opts: rw,sync,soft,timeo=30,retrans=3,_netdev,nofail,nofsc
    state: mounted
