---
- name: Set up NodeSource Node.js 22 repository and install Node.js
  shell: |
    curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    apt-get install -y nodejs
  args:
    creates: /usr/bin/node

- name: Set up Caddy repository and install Caddy
  shell: |
    curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
    curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
    apt-get update
    apt-get install -y caddy
  args:
    creates: /usr/bin/caddy

- name: Create mcp working directory
  file:
    path: "/opt/mcp/{{ item.name }}"
    state: directory
    mode: "0755"
  loop: "{{ mcp_servers }}"

- name: Template systemd unit for each MCP server
  template:
    src: mcp.service.j2
    dest: "/etc/systemd/system/mcp-{{ item.name }}.service"
    mode: "0644"
  loop: "{{ mcp_servers }}"
  notify: reload systemd and restart mcp services

- name: Template Caddyfile
  template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
  notify: restart caddy

- name: Enable and start MCP services
  systemd:
    name: "mcp-{{ item.name }}"
    enabled: true
    state: started
    daemon_reload: true
  loop: "{{ mcp_servers }}"

- name: Enable and start Caddy
  systemd:
    name: caddy
    enabled: true
    state: started
