---
- name: Create flux-system namespace
  shell: kubectl create namespace flux-system --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /home/david/.kube/config

- name: Create SOPS age secret
  shell: |
    kubectl create secret generic sops-age \
      --namespace=flux-system \
      --from-literal=age.agekey="{{ sops_age_key }}" \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /home/david/.kube/config
  no_log: true

- name: Create admin namespace
  shell: kubectl create namespace admin --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /home/david/.kube/config

- name: Create Cloudflare API token secret for ExternalDNS
  shell: |
    kubectl create secret generic cloudflare-api-token \
      --namespace=admin \
      --from-literal=cloudflare_api_token="{{ cloudflare_api_token }}" \
      --dry-run=client -o yaml | kubectl apply -f -
  environment:
    KUBECONFIG: /home/david/.kube/config
  no_log: true

- name: Bootstrap Flux against yggdrasil repo
  command: >
    flux bootstrap github
    --owner=XLRINN
    --repository=yggdrasil
    --branch=master
    --path=clusters/home
    --personal
    --token-auth
  environment:
    KUBECONFIG: /home/david/.kube/config
    GITHUB_TOKEN: "{{ github_token }}"
  become: false
  become_user: david
