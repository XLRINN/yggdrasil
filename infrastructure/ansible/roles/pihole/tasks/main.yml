---
# Pi-hole role
# Installs Pi-hole and manages local DNS entries from vars/services.yml

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install dependencies
  apt:
    name:
      - curl
      - git
      - wget
    state: present

- name: Create Pi-hole config directory
  file:
    path: /etc/pihole
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write Pi-hole unattended setup config
  copy:
    dest: /etc/pihole/setupVars.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      PIHOLE_INTERFACE=eth0
      IPV4_ADDRESS=192.168.69.2/24
      IPV6_ADDRESS=
      QUERY_LOGGING=true
      INSTALL_WEB_SERVER=true
      INSTALL_WEB_INTERFACE=true
      LIGHTTPD_ENABLED=true
      CACHE_SIZE=10000
      DNS_FQDN_REQUIRED=true
      DNS_BOGUS_PRIV=true
      DNSMASQ_LISTENING=local
      BLOCKING_MODE=NULL
      DNSSEC=false
      REV_SERVER=false
      PIHOLE_DNS_1=1.1.1.1
      PIHOLE_DNS_2=8.8.8.8

- name: Download Pi-hole installer
  get_url:
    url: https://install.pi-hole.net
    dest: /tmp/pihole-install.sh
    mode: "0755"

- name: Install Pi-hole (unattended)
  command: bash /tmp/pihole-install.sh --unattended
  args:
    creates: /usr/local/bin/pihole

- name: Set Pi-hole admin password
  command: pihole -a -p "{{ pihole_password }}"
  no_log: true
  changed_when: false

- name: Write custom DNS entries from services registry
  template:
    src: custom.list.j2
    dest: /etc/pihole/custom.list
    owner: root
    group: root
    mode: "0644"
  notify: restart pihole dns

- name: Enable and start Pi-hole FTL
  systemd:
    name: pihole-FTL
    enabled: true
    state: started
