---
- name: Install Longhorn prerequisites
  apt:
    name:
      - open-iscsi
      - nfs-common
      - util-linux
    state: present

- name: Enable and start iscsid
  systemd:
    name: iscsid
    enabled: true
    state: started

- name: Blacklist Longhorn devices from multipathd
  copy:
    dest: /etc/multipath/conf.d/longhorn.conf
    content: |
      blacklist {
        devnode "^sd[a-z0-9]+"
      }
    owner: root
    group: root
    mode: "0644"
  notify: restart multipathd

- name: Ensure multipathd is running (needed to pick up blacklist)
  systemd:
    name: multipathd
    state: started
    enabled: true
  ignore_errors: true

- name: Add Longhorn Helm repository
  command: helm repo add longhorn https://charts.longhorn.io
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Update Helm repositories
  command: helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Install Longhorn
  command: >
    helm upgrade --install longhorn longhorn/longhorn
    --namespace longhorn-system
    --create-namespace
    --set defaultSettings.backupTarget="nfs://192.168.69.5:/alexandria/longhorn-backups"
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false
