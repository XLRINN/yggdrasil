---
- name: Install Longhorn node prerequisites
  apt:
    name:
      - open-iscsi
      - nfs-common
      - util-linux
    state: present

- name: Enable and start iscsid
  systemd:
    name: iscsid
    enabled: true
    state: started

- name: Blacklist Longhorn devices from multipathd
  copy:
    dest: /etc/multipath/conf.d/longhorn.conf
    content: |
      blacklist {
        devnode "^sd[a-z0-9]+"
      }
    owner: root
    group: root
    mode: "0644"
  notify: restart multipathd

- name: Ensure multipathd is running (needed to pick up blacklist)
  systemd:
    name: multipathd
    state: started
    enabled: true
  ignore_errors: true
