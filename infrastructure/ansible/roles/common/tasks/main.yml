---
# Expand disk FIRST before any apt calls — ubuntu cloud images ship
# cloud-guest-utils pre-installed, so growpart is available immediately.
# Skipped on LXC: /dev/sda there is the Proxmox host's physical disk leaking
# through (privileged container), not the container's own rootfs — the LXC's
# root volume is already sized correctly by Terraform/Proxmox, so there's no
# in-guest partition to grow.
- name: Grow root partition to fill disk
  command: growpart /dev/sda 1
  register: growpart_result
  changed_when: "'CHANGED' in growpart_result.stdout"
  failed_when: growpart_result.rc != 0 and 'NOCHANGE' not in growpart_result.stdout
  when: ansible_virtualization_type != "lxc"

- name: Resize root filesystem
  command: resize2fs /dev/sda1
  when: ansible_virtualization_type != "lxc" and growpart_result.changed

- name: Stop and disable unattended-upgrades and apt timers
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  ignore_errors: true
  loop:
    - unattended-upgrades
    - apt-daily.timer
    - apt-daily-upgrade.timer
    - apt-daily.service
    - apt-daily-upgrade.service

- name: Kill any running apt or dpkg processes
  command: killall apt apt-get dpkg
  ignore_errors: true
  changed_when: false

- name: Remove stale apt lock files
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /var/lib/dpkg/lock-frontend
    - /var/lib/dpkg/lock
    - /var/cache/apt/archives/lock

- name: Update apt cache
  apt:
    update_cache: true
    cache_valid_time: 3600

- name: Fix broken packages
  command: apt-get -y --fix-broken install
  changed_when: false

- name: Install base packages
  apt:
    name:
      - cloud-guest-utils
      - parted
      - curl
      - git
      - wget
      - unzip
      - apt-transport-https
      - ca-certificates
      - gnupg
      - lsb-release
      - qemu-guest-agent
      - rclone
      - aria2
      - neovim
      - tmux
      - nfs-common
    state: present

- name: Enable and start qemu-guest-agent
  systemd:
    name: qemu-guest-agent
    enabled: true
    state: started
  ignore_errors: true

- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"
