---
- name: Download NodeSource setup script
  get_url:
    url: https://deb.nodesource.com/setup_22.x
    dest: /tmp/nodesource_setup.sh
    mode: "0755"

- name: Run NodeSource setup script
  command: bash /tmp/nodesource_setup.sh
  args:
    creates: /etc/apt/sources.list.d/nodesource.list

- name: Install Node.js
  apt:
    name: nodejs
    state: present
    update_cache: true

- name: Install Claude CLI
  npm:
    name: "@anthropic-ai/claude-code"
    global: true
    state: present

- name: Auto-start tmux on SSH login
  blockinfile:
    path: "~{{ claude_cli_user }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED — tmux auto-start"
    block: |
      if [ -z "$TMUX" ] && [ "$TERM" != "screen" ]; then
        tmux attach 2>/dev/null || tmux new-session
      fi
    create: true
    owner: "{{ claude_cli_user }}"
    group: "{{ claude_cli_user }}"
    mode: "0644"

- name: Get latest yazi release
  uri:
    url: https://api.github.com/repos/sxyazi/yazi/releases/latest
    return_content: true
  register: yazi_release

- name: Download yazi
  get_url:
    url: "{{ yazi_release.json.assets | selectattr('name', 'equalto', 'yazi-x86_64-unknown-linux-gnu.zip') | map(attribute='browser_download_url') | first }}"
    dest: /tmp/yazi.zip
    mode: "0644"
  when: not ansible_check_mode

- name: Install unzip
  apt:
    name: unzip
    state: present

- name: Extract yazi
  unarchive:
    src: /tmp/yazi.zip
    dest: /tmp/
    remote_src: true

- name: Install yazi binary
  copy:
    src: /tmp/yazi-x86_64-unknown-linux-gnu/yazi
    dest: /usr/local/bin/yazi
    mode: "0755"
    remote_src: true
