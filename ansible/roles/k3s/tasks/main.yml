---
- name: Check if K3s is already installed
  stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Write K3s config
  copy:
    dest: /etc/rancher/k3s/config.yaml
    content: "{{ k3s_config | combine({'tls-san': [ansible_host]}) | to_nice_yaml }}"
    mode: "0600"
  notify: Restart k3s

- name: Download and install K3s
  shell: |
    curl -sfL https://get.k3s.io | \
    {% if k3s_version | length > 0 %}INSTALL_K3S_VERSION="{{ k3s_version }}" {% endif %}\
    sh -
  args:
    creates: /usr/local/bin/k3s

- name: Wait for K3s to be ready
  command: k3s kubectl get nodes
  retries: 20
  delay: 5
  register: result
  until: result.rc == 0
  changed_when: false

- name: Create .kube directory for {{ server_user }}
  file:
    path: /home/{{ server_user }}/.kube
    state: directory
    owner: "{{ server_user }}"
    group: "{{ server_user }}"
    mode: "0700"

- name: Copy kubeconfig for {{ server_user }}
  copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: /home/{{ server_user }}/.kube/config
    remote_src: true
    owner: "{{ server_user }}"
    group: "{{ server_user }}"
    mode: "0600"

- name: Replace localhost with server IP in kubeconfig
  replace:
    path: /home/{{ server_user }}/.kube/config
    regexp: 'https://127\.0\.0\.1:6443'
    replace: "https://{{ ansible_host }}:6443"

- name: Set KUBECONFIG in {{ server_user }} profile
  lineinfile:
    path: /home/{{ server_user }}/.bashrc
    line: 'export KUBECONFIG=$HOME/.kube/config'
    state: present
