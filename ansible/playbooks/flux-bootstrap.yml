---
# Bootstrap Flux on the cluster, pointing it at this repository.
# Prerequisites:
#   - kubeconfig.yml must exist (generated by k3s-install.yml)
#   - GITHUB_TOKEN env var must be set (or use flux_github_token var)
#   - flux CLI must be installed locally (it's in the devcontainer)

- name: Bootstrap Flux
  hosts: localhost
  gather_facts: false

  vars:
    kubeconfig: "{{ playbook_dir }}/../kubeconfig.yml"
    github_owner: xlrinn   # update if your GitHub org/user differs
    github_repo: yggdrasil

  environment:
    KUBECONFIG: "{{ kubeconfig }}"

  tasks:
    - name: Check flux prerequisites
      ansible.builtin.command: flux check --pre
      changed_when: false

    - name: Bootstrap Flux (idempotent)
      ansible.builtin.command: >
        flux bootstrap github
          --owner={{ github_owner }}
          --repository={{ github_repo }}
          --branch={{ flux_git_branch }}
          --path={{ flux_path }}
          --personal
          --token-auth
      environment:
        GITHUB_TOKEN: "{{ lookup('env', 'GITHUB_TOKEN') }}"
      register: flux_bootstrap
      changed_when: "'already up to date' not in flux_bootstrap.stdout"

    - name: Wait for Flux controllers to be ready
      ansible.builtin.command: flux check
      register: flux_check
      until: flux_check.rc == 0
      retries: 20
      delay: 15
      changed_when: false
