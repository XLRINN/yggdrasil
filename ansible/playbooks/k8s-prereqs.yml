---
# Verify and re-apply k8s prerequisites on all nodes.
# Cloud-init handles the first pass; this playbook is idempotent.

- name: Kubernetes prerequisites
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Ensure kernel modules are loaded
      community.general.modprobe:
        name: "{{ item }}"
        state: present
        persistent: present
      loop:
        - overlay
        - br_netfilter

    - name: Apply k8s sysctl settings
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/99-kubernetes.conf
        reload: true
      loop:
        - { key: "net.bridge.bridge-nf-call-iptables", value: "1" }
        - { key: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
        - { key: "net.ipv4.ip_forward", value: "1" }

    - name: Disable swap
      command: swapoff -a
      changed_when: false

    - name: Remove swap from fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*\s+swap\s+.*)$'
        replace: '#\1'

    - name: Ensure open-iscsi is running
      ansible.builtin.service:
        name: iscsid
        state: started
        enabled: true

    - name: Ensure qemu-guest-agent is running
      ansible.builtin.service:
        name: qemu-guest-agent
        state: started
        enabled: true
